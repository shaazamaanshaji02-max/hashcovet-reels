name: bot
# Light actions. Triggered only by the Cloudflare Worker (Telegram buttons/commands + exact-time cron).
on:
  workflow_dispatch:
    inputs:
      action: { description: "daily|remind|publish|new|plan|status|linkgroup|access|aitest|keepall|keepno|vundo|voicecheck|sok|sch|vok|vcap|vtag|vch|repost|connectcheck|unpubq|unpub|unpubno|rp*|rmq*|rm*|pman|posted|open|vtime|settime|celebrations|health|remake|fetchmusic|report|reportauto|crash|redeploy|vreport|sgy|sgo|sgm|sgx|sgn|sga|rules|rdel|radd|tpo|tpn|tsw", required: true, default: "new" }
      job:    { description: "job id", required: false, default: "" }
      text:   { description: "instruction / new caption / hashtags / topic hint", required: false, default: "" }
      who:    { description: "name of the team member who pressed/typed", required: false, default: "" }
permissions:
  contents: write
  actions: write
  models: read
concurrency:
  group: bot-${{ github.event.inputs.job || github.event.inputs.action }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy matplotlib
      - run: git config user.name "hashcovet-bot" && git config user.email "bot@users.noreply.github.com"
      - name: act
        id: act
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          JOB: ${{ github.event.inputs.job }}
          TEXT: ${{ github.event.inputs.text }}
          WHO: ${{ github.event.inputs.who }}
        run: python pipeline/main.py "$ACTION" "$JOB" "$TEXT"
      - name: tell Telegram if this run crashed
        if: failure() && steps.act.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('config.json')).get('group_chat_id') or '$TELEGRAM_CHAT_ID')")
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$CHAT" \
            --data-urlencode text="🩺 A background job crashed: ${{ github.workflow }} (${{ github.event.inputs.action || github.event.inputs.job }}). Details: $RUN_URL — ask Claude to check if it repeats." >/dev/null
