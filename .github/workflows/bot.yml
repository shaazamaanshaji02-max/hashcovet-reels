name: bot
# Light actions. Triggered only by the Cloudflare Worker (Telegram buttons/commands + exact-time cron).
on:
  workflow_dispatch:
    inputs:
      action: { description: "daily|remind|publish|new|plan|status|linkgroup|access|sok|sch|vok|vcap|vtag|vch", required: true, default: "new" }
      job:    { description: "job id", required: false, default: "" }
      text:   { description: "instruction / new caption / hashtags / topic hint", required: false, default: "" }
permissions:
  contents: write
  actions: write
concurrency:
  group: bot-${{ github.event.inputs.job || github.event.inputs.action }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: git config user.name "hashcovet-bot" && git config user.email "bot@users.noreply.github.com"
      - name: act
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          JOB: ${{ github.event.inputs.job }}
          TEXT: ${{ github.event.inputs.text }}
        run: python pipeline/main.py "$ACTION" "$JOB" "$TEXT"
