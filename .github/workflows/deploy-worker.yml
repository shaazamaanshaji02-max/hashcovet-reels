name: deploy-worker
# Deploys the Cloudflare Worker (Telegram bridge + exact-time schedule), sets its secrets, registers the webhook.
# Runs automatically when worker/ changes, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: deploy + secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHT: ${{ secrets.WORKER_GITHUB_TOKEN }}
        run: |
          # schedule store (KV): create once, bind as SCHED
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | python3 -c "import json,sys;print(next((n['id'] for n in json.load(sys.stdin).get('result',[]) if n['title']=='hashcovet-reels-sched'),''))")
          if [ -z "$ID" ]; then ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" -d '{"title":"hashcovet-reels-sched"}' "$API" | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['id'])"); fi
          echo "KV namespace: $ID"
          printf '\n[[kv_namespaces]]\nbinding = "SCHED"\nid = "%s"\n' "$ID" >> wrangler.toml
          npx --yes wrangler@3 deploy | tee deploy.log
          printf '%s' "$TG"  | npx --yes wrangler@3 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$GHT" | npx --yes wrangler@3 secret put GITHUB_TOKEN
          grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 > url.txt
          echo "Worker URL: $(cat url.txt)"
      - name: register Telegram webhook
        working-directory: worker
        run: |
          for i in 1 2 3 4 5 6; do sleep 10; curl -sf "$(cat url.txt)/setup" && exit 0; done
          echo "Webhook not confirmed yet - open <worker-url>/setup in a browser once."
