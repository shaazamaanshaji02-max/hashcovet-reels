name: fetch-music
# Manual: refresh the CC0 background-music library from Openverse (assets/music + credits.json).
on:
  workflow_dispatch:
    inputs:
      n: { description: "how many tracks", required: false, default: "8" }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: private data
        env: { DATA_TOKEN: "${{ secrets.DATA_TOKEN }}" }
        run: bash scripts/use_data.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install requests
      - run: rm -f assets/music/*.mp3 && python pipeline/fetch_music.py --n "${{ github.event.inputs.n }}"
      - run: |
          git config user.name "hashcovet-bot" && git config user.email "bot@users.noreply.github.com"
          git add assets/music && git commit -m "refresh music library" && git push || echo "no changes"
