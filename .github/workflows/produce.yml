name: produce
# Heavy: Arjun's voice (Kokoro -> Seed-VC) + video render, then Telegram preview.
on:
  workflow_dispatch:
    inputs:
      job:  { required: true }
      note: { required: false, default: "" }
permissions:
  contents: write
  actions: write
concurrency:
  group: produce-${{ github.event.inputs.job }}
  cancel-in-progress: true
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: free disk space (voice tool needs room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/go" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: keep installed tools between videos (saves ~20 GitHub minutes per video)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pythonLocation }}
            ~/.cache/ms-playwright
          key: pyenv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-seedvc-v1
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .seedvc
            checkpoints
          key: seedvc-v1
      - run: git config user.name "hashcovet-bot" && git config user.email "bot@users.noreply.github.com"
      - name: voice + video
        id: make
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB: ${{ github.event.inputs.job }}
          NOTE: ${{ github.event.inputs.note }}
        run: python pipeline/produce.py "$JOB" "$NOTE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-${{ github.event.inputs.job }}
          path: build/*.mp4
          retention-days: 30
      - name: tell Telegram if this run crashed
        if: failure() && steps.make.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CHAT=$(python3 -c "import json;print(json.load(open('config.json')).get('group_chat_id') or '$TELEGRAM_CHAT_ID')")
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$CHAT" \
            --data-urlencode text="🩺 A background job crashed: ${{ github.workflow }} (${{ github.event.inputs.action || github.event.inputs.job }}). Details: $RUN_URL — ask Claude to check if it repeats." >/dev/null
