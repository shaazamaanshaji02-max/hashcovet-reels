name: watchdog
# Independent of the Cloudflare bot: GitHub's own (slightly late) schedule checks the bot is alive and linked.
on:
  schedule:
    - cron: "17 1,13 * * *"   # ~06:47 and ~18:47 IST
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python pipeline/watchdog.py
