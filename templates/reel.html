<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hashcovet reel</title>
<style>
@font-face{font-family:'Pinyon Script';src:url(../assets/fonts/PinyonScript.woff2)}
@font-face{font-family:'Poppins';font-weight:300;src:url(../assets/fonts/Poppins-300.woff2)}
@font-face{font-family:'Poppins';font-weight:400;src:url(../assets/fonts/Poppins-400.woff2)}
@font-face{font-family:'Poppins';font-weight:600;src:url(../assets/fonts/Poppins-600.woff2)}
@font-face{font-family:'Poppins';font-weight:700;src:url(../assets/fonts/Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff}
#gTR{position:absolute;inset:0;background:radial-gradient(circle 800px at 100% 0%,rgba(129,26,118,1) 0%,rgba(129,26,118,.8) 16%,rgba(129,26,118,.56) 33%,rgba(129,26,118,.34) 50%,rgba(129,26,118,.17) 66%,rgba(129,26,118,.06) 82%,rgba(129,26,118,0) 100%)}
#gBL{position:absolute;inset:0;background:radial-gradient(circle 900px at 0% 100%,rgba(129,26,118,1) 0%,rgba(129,26,118,.8) 15%,rgba(129,26,118,.58) 30%,rgba(129,26,118,.37) 45%,rgba(129,26,118,.2) 60%,rgba(129,26,118,.08) 75%,rgba(129,26,118,0) 100%)}
#grid{position:absolute;left:-116px;top:-93px;width:1312px;height:2106px;background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:58px 46.5px;background-position:41px 23px}
.a{position:absolute;opacity:0}
.c{left:0;width:1080px;text-align:center}
.b{font-weight:600;letter-spacing:-1px;line-height:1.08}
.s,.sc{font-family:'Pinyon Script',cursive;font-weight:400;color:#BA1A58;letter-spacing:0}
.s{line-height:1}
.l{font-weight:600;letter-spacing:7px;text-transform:uppercase}
.pill{display:flex;align-items:center;gap:16px;border:2px solid #fff;border-radius:999px;padding:0 40px;font-weight:400}
#phone{left:330px;top:600px;width:420px;height:780px;border:2px solid #fff;border-radius:58px;background:#000;overflow:hidden;box-shadow:0 0 50px rgba(129,26,118,.45)}
.notch{position:absolute;left:150px;top:18px;width:120px;height:30px;border-radius:15px;background:#000;z-index:5;border:1px solid #222}
.scr{position:absolute;inset:0;opacity:0}
.ico{fill:none;stroke-linecap:round;stroke-linejoin:round}
#flash{position:absolute;inset:0;background:#BA1A58;opacity:0;mix-blend-mode:screen}
</style></head>
<body><div id="stage">
<div style="position:absolute;inset:0;background:#000"></div><div id="gTR"></div><div id="gBL"></div><div id="grid"></div>

<!-- thumbnail chrome (first second only) -->
<div id="logoTL" class="a" style="left:70px;top:150px;width:300px;height:107.5px"></div>
<div id="socTR" class="a" style="right:74px;top:190px;display:flex;gap:9px"></div>
<div id="webBL" class="a pill" style="left:72px;top:1480px;height:78px;font-size:25px"><span class="globe"></span>hashcovet.com</div>
<div id="arrBR" class="a" style="left:890px;top:1480px;width:78px;height:78px"><svg width="78" height="78" viewBox="0 0 62 62"><circle cx="31" cy="31" r="29.5" fill="none" stroke="#BA1A58" stroke-width="2.4"/><path d="M21 41L41 21M27 21h14v14" fill="none" stroke="#BA1A58" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<!-- watermarks (inside content) -->
<div id="wmLogo" class="a" style="left:64px;top:190px;width:190px;height:68px"></div>
<div id="wmWeb" class="a" style="right:72px;top:212px;font-size:24px;letter-spacing:.5px;color:rgba(255,255,255,.6)">hashcovet.com</div>

<!-- hook / thumbnail -->
<div id="h1" class="a c b" style="top:600px;font-size:92px;padding:0 90px"></div>
<div id="h2" class="a c s" style="top:880px;font-size:208px"></div>
<div id="h3" class="a c" style="top:1170px;font-size:44px;font-weight:300"></div>
<div id="h4" class="a" style="left:500px;top:1260px;width:80px;height:80px"><svg viewBox="0 0 24 24" width="80" height="80" class="ico" stroke="#BA1A58" stroke-width="2.2"><path d="M12 4v16M5 13l7 7 7-7"/></svg></div>

<!-- tips -->
<div id="kick" class="a c l" style="top:330px;font-size:32px;color:#BA1A58"></div>
<div id="title" class="a c b" style="top:385px;font-size:74px;line-height:1.12;padding:0 60px"></div>
<div id="phone" class="a"><div class="notch"></div>
  <div id="bad" class="scr" style="background:#050205">
    <div id="badIco" style="position:absolute;left:135px;top:120px;width:150px;height:150px;opacity:.55"></div>
    <div id="badLines" style="position:absolute;left:46px;right:46px;top:330px;font-family:'DejaVu Sans Mono',monospace;font-size:28px;line-height:1.9;color:rgba(255,255,255,.55)"></div>
    <div id="strike" style="position:absolute;left:40px;top:300px;height:5px;width:0;background:rgba(186,26,88,.9);transform:rotate(-14deg);transform-origin:left center;border-radius:3px"></div>
  </div>
  <div id="good" class="scr" style="background:radial-gradient(circle at 50% 38%,#4d0f47,#000 70%)">
    <div id="goodIco" style="position:absolute;left:85px;top:100px;width:250px;height:250px"></div>
    <div id="goodHead" style="position:absolute;top:420px;width:100%;text-align:center;font-size:54px;font-weight:600;padding:0 20px"></div>
    <div id="goodScr" class="s" style="position:absolute;top:500px;width:100%;text-align:center;font-size:84px"></div>
  </div>
</div>
<div id="badge" class="a" style="left:690px;top:550px;width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #fff"></div>
<div id="fix" class="a c" style="top:1425px;font-size:44px;font-weight:300;line-height:1.25;padding:0 90px"></div>

<!-- save -->
<div id="sv1" class="a" style="left:420px;top:520px;width:240px;height:240px"><svg viewBox="0 0 24 24" width="240" height="240" class="ico" stroke="#fff" stroke-width="1.4"><path id="bm" d="M6 3h12v18l-6-4.5L6 21z" fill="transparent"/></svg></div>
<div id="sv2" class="a c b" style="top:830px;font-size:88px;padding:0 60px"></div>
<div id="sv3" class="a c s" style="top:935px;font-size:220px"></div>
<div id="sv4" class="a c" style="top:1200px;font-size:40px;font-weight:300;padding:0 120px"></div>

<!-- cta -->
<div id="e1" class="a" style="left:180px;top:520px;width:720px;height:258px"></div>
<div id="e3" class="a c b" style="top:900px;font-size:72px;padding:0 50px"></div>
<div id="e4" class="a" style="left:0;width:1080px;top:1140px;display:flex;justify-content:center"><div id="socEnd" style="display:flex;gap:18px"></div></div>
<div id="e5" class="a" style="left:0;width:1080px;top:1250px;display:flex;justify-content:center;gap:24px">
  <div class="pill" style="height:92px;font-size:32px"><span class="globe"></span>hashcovet.com</div>
  <div class="pill" style="height:92px;font-size:32px;font-weight:600;background:#BA1A58;border-color:#BA1A58">Follow <svg width="30" height="30" viewBox="0 0 24 24" class="ico" stroke="#fff" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg></div>
</div>
<div id="flash"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const LOGO=id=>`<svg width="100%" height="100%" viewBox="0 0 240 86"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211463"/><stop offset="1" stop-color="#C2165C"/></linearGradient></defs><circle cx="32" cy="34.5" r="30.5" fill="url(#${id})"/><text x="13" y="50" font-family="Poppins" font-weight="700" font-size="41" fill="#fff">#</text><text x="49" y="61" font-family="Poppins" font-weight="700" font-size="64" fill="#fff" stroke="#000" stroke-width="7" paint-order="stroke" letter-spacing="0.5">covet</text><text x="236" y="83" text-anchor="end" font-family="Poppins" font-weight="400" font-size="14" fill="#fff">Innovate Your Desire</text></svg>`;
const SOC=['<rect width="24" height="24" rx="4" fill="#fff"/><path d="M6.3 10h2.6v8H6.3z" fill="#000"/><circle cx="7.6" cy="7.2" r="1.5" fill="#000"/><path d="M10.6 10h2.5v1.1c.5-.8 1.4-1.3 2.6-1.3 2 0 3.1 1.3 3.1 3.6V18h-2.6v-4.1c0-1.1-.4-1.7-1.3-1.7-1 0-1.6.7-1.6 1.8v4h-2.7z" fill="#000"/>',
'<rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="12" cy="12" r="4.4" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="17.3" cy="6.7" r="1.3" fill="#fff"/>',
'<rect width="24" height="24" rx="4" fill="#fff"/><path d="M14.2 24v-9h3l.4-3.4h-3.4V9.4c0-1 .3-1.7 1.7-1.7h1.8V4.6c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.5v2.6H7.8V15h2.9v9z" fill="#000"/>',
'<rect x="1" y="1" width="22" height="22" rx="4" fill="none" stroke="#fff" stroke-width="2"/><path d="M6.4 6h3.3l7.9 12h-3.3z" fill="none" stroke="#fff" stroke-width="1.3"/><path d="M17.2 6.2 6.9 17.8" stroke="#fff" stroke-width="1.3"/>'];
const soc=px=>SOC.map(g=>`<svg viewBox="0 0 24 24" style="width:${px}px;height:${px}px">${g}</svg>`).join('');
const GLOBE=px=>`<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4.2" ry="9.5"/><path d="M2.5 12h19M4 7h16M4 17h16"/></svg>`;
const ICON={
 logo:'<circle cx="12" cy="12" r="9.5"/><path d="M9.5 16.5v-9h3.2a2.6 2.6 0 0 1 0 5.2H9.5M12.6 12.7l3 3.8"/>',
 headphones:'<path d="M3 15v-3a9 9 0 0 1 18 0v3"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/>',
 mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>',
 captions:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 10h5M6 14h7M13 10h5M15 14h3"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
 heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
 megaphone:'<path d="M3 10v4h4l7 5V5l-7 5z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a7.5 7.5 0 0 1 0 11"/>',
 tv:'<rect x="2" y="7" width="20" height="13" rx="2"/><path d="M8 3l4 4 4-4"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
 phone:'<rect x="7" y="2" width="10" height="20" rx="2.2"/><path d="M11 9.5v5l4-2.5z"/>',
 mic:'<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/>',
 camera:'<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
 eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
 play:'<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/>',
 star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
 cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
 light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>'};
const icon=(n,col,sw)=>`<svg viewBox="0 0 24 24" width="100%" height="100%" class="ico" stroke="${col}" stroke-width="${sw}">${ICON[n]||ICON.play}</svg>`;
const X=`<svg viewBox="0 0 24 24" width="60" height="60" class="ico" stroke="#fff" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const CHK=`<svg viewBox="0 0 24 24" width="64" height="64" class="ico" stroke="#fff" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
const E=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3); const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function io(el,t,tin,tout,{dy=60,dur=.45,out=.25,scale=0,clip=false,blur=0}={}){
  const e=$(el); const i=tin<=0?1:eo(p(t,tin,tin+dur)); const o=p(t,tout-out,tout);
  e.style.opacity=i*(1-o);
  e.style.transform=`translateY(${(1-i)*dy-o*dy*.6}px) scale(${1+(1-i)*scale-o*.04})`;
  if(clip) e.style.clipPath=`inset(-20% ${(1-(tin<=0?1:eo(p(t,tin,tin+dur*1.4))))*100}% -20% 0)`;
  if(blur) e.style.filter=`blur(${(1-i)*blur}px)`;
}

let S,TL,curTip=-1;
window.setup=function(spec,tl){
  S=spec; TL=tl;
  $('logoTL').innerHTML=LOGO('lg1'); $('wmLogo').innerHTML=LOGO('lg3'); $('e1').innerHTML=LOGO('lg2');
  $('socTR').innerHTML=soc(24); $('socEnd').innerHTML=soc(52);
  document.querySelectorAll('.globe').forEach((g,i)=>g.innerHTML=GLOBE(i?38:32));
  $('h1').textContent=S.hook.line; $('h2').textContent=S.hook.script; $('h3').textContent=S.hook.sub||'3 mistakes + the fix';
  $('sv2').textContent=S.save.line; $('sv3').textContent=S.save.script; $('sv4').textContent=S.save.sub||'';
  $('e3').innerHTML=`${E(S.cta.line)} <span class="sc" style="font-size:130px;line-height:.5">${E(S.cta.script)}</span>`;
  // auto-fit hook script and long titles
  fit('h2',208,960); fit('sv2',88,960); fit('sv3',220,960); fit('h3',44,960);
};
function fit(id,max,w,min=36){const e=$(id); e.style.fontSize=max+'px'; const sp=document.createElement('span'); sp.textContent=e.textContent; sp.style.cssText='position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit'; e.appendChild(sp); let fs=max; while(sp.offsetWidth>w&&fs>min){fs-=3;e.style.fontSize=fs+'px';} sp.remove();}
function setTip(k){
  const t=S.tips[k];
  $('kick').textContent='Mistake 0'+(k+1);
  $('title').innerHTML=`${E(t.title)} <span class="sc" style="font-size:112px;line-height:.8">${E(t.title_script)}</span>${t.title_after?' '+E(t.title_after):''}`;
  $('badIco').innerHTML=icon(t.bad.icon,'#fff',1.4);
  $('badLines').innerHTML=t.bad.lines.map(l=>`<div class="bl">• ${E(l)}</div>`).join('');
  $('goodIco').innerHTML=icon(t.good.icon,'#fff',1.6);
  $('goodHead').textContent=t.good.headline; $('goodScr').textContent=t.good.script; fit('goodHead',54,370); fit('goodScr',84,380);
  $('fix').innerHTML=`<span style="font-weight:600">Fix:</span> ${E(t.fix)}`;
}

window.seek=function(t){
  $('grid').style.transform=`translate(${(t*8)%58}px,${(t*9.3)%46.5}px)`;
  $('gTR').style.opacity=.9+.1*Math.sin(t*1.3); $('gBL').style.opacity=.9+.1*Math.cos(t*1.1);
  // thumbnail chrome: fully visible for the first ~1s, then gone
  const th=1-p(t,TL.thumb-0.25,TL.thumb);
  for(const id of ['logoTL','socTR','webBL','arrBR','h1','h2','h3','h4']){ $(id).style.opacity=th; $(id).style.transform=''; }
  // watermarks inside content
  const wm=p(t,TL.thumb,TL.thumb+0.3)*(1-p(t,TL.cta.s-0.3,TL.cta.s)); $('wmLogo').style.opacity=wm*.9; $('wmWeb').style.opacity=wm;
  // tips
  const k=TL.tips.findIndex(x=>t>=x.s&&t<x.e);
  if(k>=0){
    const tp=TL.tips[k]; if(k!==curTip){curTip=k; setTip(k);}
    const hin=eo(p(t,tp.s,tp.s+.4)), hout=p(t,tp.e-.25,tp.e);
    for(const id of ['kick','title']){ $(id).style.opacity=hin*(1-hout); $(id).style.transform=`translateY(${(1-hin)*40}px)`; }
    const mist=t<tp.fx; $('bad').style.opacity=mist?1:0; $('good').style.opacity=mist?0:1;
    if(mist){ const lt=t-tp.s;
      $('badIco').style.transform=`rotate(${Math.sin(lt*6)*4}deg)`;
      document.querySelectorAll('.bl').forEach((b,i)=>{b.style.opacity=cl((lt-.35-i*.25)/.2);});
      $('strike').style.width=(eo(p(t,tp.fx-.55,tp.fx-.15))*330)+'px';
    } else { const lt=t-tp.fx;
      $('goodIco').style.transform=`scale(${.7+.3*eb(cl(lt/.5))}) translateY(${Math.sin(lt*3)*8}px)`;
      $('goodHead').style.opacity=cl((lt-.15)/.25); $('goodScr').style.clipPath=`inset(-20% ${(1-eo(cl((lt-.3)/.6)))*100}% -20% 0)`;
    }
    const bt=mist?tp.s+.6:tp.fx+.1, bd=$('badge');
    bd.innerHTML=mist?X:CHK; bd.style.background=mist?'#000':'#BA1A58'; bd.style.borderColor=mist?'#fff':'#BA1A58';
    bd.style.opacity=cl(p(t,bt,bt+.15))*(1-hout); bd.style.transform=`scale(${eb(p(t,bt,bt+.35))})`;
    const fi=eo(p(t,tp.fx+.15,tp.fx+.55)); $('fix').style.opacity=fi*(1-hout); $('fix').style.transform=`translateY(${(1-fi)*40}px)`;
  } else { for(const id of ['kick','title','badge','fix']) $(id).style.opacity=0; }
  const T0=TL.tips[0].s, T1=TL.tips[2].e, pin=eo(p(t,T0-.05,T0+.45)), pout=p(t,T1-.25,T1);
  $('phone').style.opacity=(t>=T0-.05&&t<T1)?pin*(1-pout):0; $('phone').style.transform=`translateY(${(1-pin)*200}px) scale(${.9+.1*pin})`;
  // save
  const sv=TL.save; io('sv1',t,sv.s+.05,sv.e,{dy:0,scale:.5}); $('bm').setAttribute('fill', t>sv.s+.55?'#BA1A58':'transparent');
  io('sv2',t,sv.s+.2,sv.e,{dy:60}); io('sv3',t,sv.s+.45,sv.e,{dy:20,clip:true,dur:.65}); io('sv4',t,sv.s+.9,sv.e,{dy:30});
  // cta
  const ct=TL.cta; io('e1',t,ct.s+.05,99,{dy:0,scale:.35,dur:.55,blur:18}); io('e3',t,ct.s+.5,99,{dy:20,clip:true,dur:.7});
  io('e4',t,ct.s+.9,99,{dy:40}); io('e5',t,ct.s+1.1,99,{dy:40});
  // flash on cuts
  const cuts=[TL.thumb,...TL.tips.flatMap(x=>[x.s,x.fx]),sv.s,ct.s]; let fl=0;
  for(const c of cuts){const d=t-c; if(d>=0&&d<.16) fl=Math.max(fl,(1-d/.16)*.2);} $('flash').style.opacity=fl;
};
</script>
</body></html>
