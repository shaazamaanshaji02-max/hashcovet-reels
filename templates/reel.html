const icon=(n,col,sw)=>`<svg viewBox="0 0 24 24" width="100%" height="100%" class="ico" stroke="${col}" stroke-width="${sw}">${ICON[n]||ICON.play}</svg>`;
const X=`<svg viewBox="0 0 24 24" width="60" height="60" class="ico" stroke="#fff" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const CHK=`<svg viewBox="0 0 24 24" width="64" height="64" class="ico" stroke="#fff" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
const E=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3); const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function io(el,t,tin,tout,{dy=60,dur=.45,out=.25,scale=0,clip=false,blur=0}={}){
  const e=$(el); const i=tin<=0?1:eo(p(t,tin,tin+dur)); const o=p(t,tout-out,tout);
  e.style.opacity=i*(1-o);
  e.style.transform=`translateY(${(1-i)*dy-o*dy*.6}px) scale(${1+(1-i)*scale-o*.04})`;
  if(clip) e.style.clipPath=`inset(-20% ${(1-(tin<=0?1:eo(p(t,tin,tin+dur*1.4))))*100}% -20% 0)`;
  if(blur) e.style.filter=`blur(${(1-i)*blur}px)`;
}

let S,TL,curTip=-1;
window.setup=function(spec,tl){
  S=spec; TL=tl;
  $('logoTL').innerHTML=LOGO('lg1'); $('wmLogo').innerHTML=LOGO('lg3'); $('e1').innerHTML=LOGO('lg2');
  $('socTR').innerHTML=soc(24); $('socEnd').innerHTML=soc(52);
  document.querySelectorAll('.globe').forEach((g,i)=>g.innerHTML=GLOBE(i?38:32));
  $('h1').textContent=S.hook.line; $('h2').textContent=S.hook.script; $('h3').textContent=S.hook.sub||'3 mistakes + the fix';
  $('sv2').textContent=S.save.line; $('sv3').textContent=S.save.script; $('sv4').textContent=S.save.sub||'';
  $('e3').innerHTML=`${E(S.cta.line)} <span class="sc" style="font-size:130px;line-height:.5">${E(S.cta.script)}</span>`;
  // auto-fit hook script and long titles
  fit('h2',208,960); fit('sv2',88,960); fit('sv3',220,960); fit('h3',44,960);
};
function fit(id,max,w,min=36){const e=$(id); e.style.fontSize=max+'px'; const sp=document.createElement('span'); sp.textContent=e.textContent; sp.style.cssText='position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit'; e.appendChild(sp); let fs=max; while(sp.offsetWidth>w&&fs>min){fs-=3;e.style.fontSize=fs+'px';} sp.remove();}
function setTip(k){
  const t=S.tips[k];
  $('kick').textContent='Mistake 0'+(k+1);
  $('title').innerHTML=`${E(t.title)} <span class="sc" style="font-size:112px;line-height:.8">${E(t.title_script)}</span>${t.title_after?' '+E(t.title_after):''}`;
  $('badIco').innerHTML=icon(t.bad.icon,'#fff',1.4);
  $('badLines').innerHTML=t.bad.lines.map(l=>`<div class="bl">• ${E(l)}</div>`).join('');
  $('goodIco').innerHTML=icon(t.good.icon,'#fff',1.6);
  $('goodHead').textContent=t.good.headline; $('goodScr').textContent=t.good.script; fit('goodHead',54,370); fit('goodScr',84,380);
  $('fix').innerHTML=`<span style="font-weight:600">Fix:</span> ${E(t.fix)}`;
}

window.seek=function(t){
  $('grid').style.transform=`translate(${(t*8)%58}px,${(t*9.3)%46.5}px)`;
  $('gTR').style.opacity=.9+.1*Math.sin(t*1.3); $('gBL').style.opacity=.9+.1*Math.cos(t*1.1);
  // thumbnail chrome: fully visible for the first ~1s, then gone
  const th=1-p(t,TL.thumb-0.25,TL.thumb);
  for(const id of ['logoTL','socTR','webBL','arrBR','h1','h2','h3','h4']){ $(id).style.opacity=th; $(id).style.transform=''; }
  // watermarks inside content
  const wm=p(t,TL.thumb,TL.thumb+0.3)*(1-p(t,TL.cta.s-0.3,TL.cta.s)); $('wmLogo').style.opacity=wm*.9; $('wmWeb').style.opacity=wm;
  // tips
  const k=TL.tips.findIndex(x=>t>=x.s&&t<x.e);
  if(k>=0){
    const tp=TL.tips[k]; if(k!==curTip){curTip=k; setTip(k);}
    const hin=eo(p(t,tp.s,tp.s+.4)), hout=p(t,tp.e-.25,tp.e);
    for(const id of ['kick','title']){ $(id).style.opacity=hin*(1-hout); $(id).style.transform=`translateY(${(1-hin)*40}px)`; }
    const mist=t<tp.fx; $('bad').style.opacity=mist?1:0; $('good').style.opacity=mist?0:1;
    if(mist){ const lt=t-tp.s;
      $('badIco').style.transform=`rotate(${Math.sin(lt*6)*4}deg)`;
      document.querySelectorAll('.bl').forEach((b,i)=>{b.style.opacity=cl((lt-.35-i*.25)/.2);});
      $('strike').style.width=(eo(p(t,tp.fx-.55,tp.fx-.15))*330)+'px';
    } else { const lt=t-tp.fx;
      $('goodIco').style.transform=`scale(${.7+.3*eb(cl(lt/.5))}) translateY(${Math.sin(lt*3)*8}px)`;
      $('goodHead').style.opacity=cl((lt-.15)/.25); $('goodScr').style.clipPath=`inset(-20% ${(1-eo(cl((lt-.3)/.6)))*100}% -20% 0)`;
    }
    const bt=mist?tp.s+.6:tp.fx+.1, bd=$('badge');
    bd.innerHTML=mist?X:CHK; bd.style.background=mist?'#000':'#BA1A58'; bd.style.borderColor=mist?'#fff':'#BA1A58';
    bd.style.opacity=cl(p(t,bt,bt+.15))*(1-hout); bd.style.transform=`scale(${eb(p(t,bt,bt+.35))})`;
    const fi=eo(p(t,tp.fx+.15,tp.fx+.55)); $('fix').style.opacity=fi*(1-hout); $('fix').style.transform=`translateY(${(1-fi)*40}px)`;
  } else { for(const id of ['kick','title','badge','fix']) $(id).style.opacity=0; }
  const T0=TL.tips[0].s, T1=TL.tips[2].e, pin=eo(p(t,T0-.05,T0+.45)), pout=p(t,T1-.25,T1);
  $('phone').style.opacity=(t>=T0-.05&&t<T1)?pin*(1-pout):0; $('phone').style.transform=`translateY(${(1-pin)*200}px) scale(${.9+.1*pin})`;
  // save
  const sv=TL.save; io('sv1',t,sv.s+.05,sv.e,{dy:0,scale:.5}); $('bm').setAttribute('fill', t>sv.s+.55?'#BA1A58':'transparent');
  io('sv2',t,sv.s+.2,sv.e,{dy:60}); io('sv3',t,sv.s+.45,sv.e,{dy:20,clip:true,dur:.65}); io('sv4',t,sv.s+.9,sv.e,{dy:30});
  // cta
  const ct=TL.cta; io('e1',t,ct.s+.05,99,{dy:0,scale:.35,dur:.55,blur:18}); io('e3',t,ct.s+.5,99,{dy:20,clip:true,dur:.7});
  io('e4',t,ct.s+.9,99,{dy:40}); io('e5',t,ct.s+1.1,99,{dy:40});
  // flash on cuts
  const cuts=[TL.thumb,...TL.tips.flatMap(x=>[x.s,x.fx]),sv.s,ct.s]; let fl=0;
  for(const c of cuts){const d=t-c; if(d>=0&&d<.16) fl=Math.max(fl,(1-d/.16)*.2);} $('flash').style.opacity=fl;
};
